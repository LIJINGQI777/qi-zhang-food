<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肠胃饮食助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        safe: '#10b981',
                        warn: '#f59e0b',
                        bad: '#ef4444',
                        main: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .loading {
            animation: fade 1.2s infinite;
        }
        @keyframes fade {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-md mx-auto">
        <!-- 标题 -->
        <h1 class="text-3xl font-bold text-gray-800 text-center mb-2">
            肠胃饮食助手
        </h1>
        <p class="text-gray-500 text-center mb-10">
            输入食物，AI帮你判断胀气风险
        </p >

        <!-- 搜索框 -->
        <div class="bg-white rounded-xl shadow-sm p-3 mb-6">
            <input 
                id="foodInput" 
                class="w-full text-lg p-2 outline-none border-b border-gray-100" 
                placeholder="输入食物/外卖菜品"
            >
            <button 
                onclick="aiCheck()" 
                class="w-full mt-3 bg-main text-white py-3 rounded-lg text-lg font-medium"
            >
                查询
            </button>
        </div>

        <!-- 结果区域 -->
        <div id="resultBox" class="bg-white rounded-xl shadow-sm p-6 hidden"></div>
    </div>

<script>
async function aiCheck() {
    const food = document.getElementById("foodInput").value.trim();
    if (!food) {
        alert("请输入食物名称");
        return;
    }

    const box = document.getElementById("resultBox");
    box.classList.remove("hidden");
    box.innerHTML = `<p class="loading text-center text-gray-500 text-lg">分析中...</p >`;

    const prompt = `你是肠胃胀气饮食专家，分析【${food}】
请严格按以下格式回复，保持精简：
1.胀气等级：安全/少量慎食/严禁胀气
2.消化难度：简单/一般/困难
3.食用建议
4.简短提醒`;

    try {
        const res = await fetch(`https://api.52vmy.cn/api/wen/chat?msg=${encodeURIComponent(prompt)}`);
        const data = await res.json();
        const text = data.text.replace(/\n/g, "<br>");
        box.innerHTML = `<div class="text-gray-700 text-base leading-relaxed">${text}</div>`;
    } catch (e) {
        box.innerHTML = `<p class="text-red-500 text-center">接口临时繁忙，请稍后再试</p >`;
    }
}
</script>
</body>
</html>
