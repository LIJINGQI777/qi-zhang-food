<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>养胃饮食小助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mainGreen: '#2E9E72',
                        safe: '#2E9E72',
                        warn: '#E6A23C',
                        bad: '#E53E3E',
                    }
                }
            }
        }
    </script>
    <style>
        body{
            background: #f5fbf8 url(https://img0.baidu.com/it/u=1817352239,2110202039&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500) center/cover no-repeat fixed;
            background-blend-mode: overlay;
            background-color: #f5fbf8;
        }
        .soft-card{
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(6px);
        }
        .loading{
            animation: fade 1.2s infinite;
        }
        @keyframes fade{
            0%,100%{opacity:0.4;}
            50%{opacity:1;}
        }
    </style>
</head>
<body class="p-5 min-h-screen">
    <div class="max-w-md mx-auto">
        <!-- 顶部标题 -->
        <div class="text-center mt-4 mb-8">
            <i class="fa-solid fa-seedling text-mainGreen text-3xl"></i>
            <h2 class="text-2xl font-bold text-gray-700 mt-2">养胃饮食小助手</h2>
            <p class="text-gray-500 text-sm mt-1">AI智能分析 · 呵护肠胃不胀气</p >
        </div>

        <!-- 搜索区域 -->
        <div class="soft-card rounded-2xl p-5 shadow-md">
            <input id="foodName" class="w-full p-3 rounded-xl border border-green-100 outline-none text-base" placeholder="输入任意食物/外卖菜品">
            <button onclick="aiCheck()" class="w-full mt-4 bg-mainGreen text-white py-3 rounded-xl font-medium">
                AI立即查询
            </button>
        </div>

        <!-- 查询结果 -->
        <div id="resultBox" class="soft-card rounded-2xl p-5 mt-5 hidden"></div>

        <!-- 底部文案 -->
        <p class="text-center text-gray-500 text-xs mt-8">🌿 清淡饮食 · 少食多餐 · 养好脾胃</p >
    </div>

<script>
async function aiCheck(){
    let food = document.getElementById("foodName").value.trim()
    if(!food){alert("请输入食物名称");return}
    let box = document.getElementById("resultBox")
    box.classList.remove("hidden")
    box.innerHTML = `<p class="loading text-center text-gray-500 text-base">🤖 AI正在分析中...</p >`

    let prompt = `你是肠胃胀气饮食专家，分析【${food}】
请严格按以下格式回复，保持精简口语化：
1.胀气等级：安全/少量慎食/严禁胀气
2.消化难度：简单/一般/困难
3.食用建议
4.简短忌口提醒`

    try{
        // 换了一个更稳定的免费AI接口
        let res = await fetch(`https://api.nihaowang.com/api/ai/chat?msg=${encodeURIComponent(prompt)}`)
        let data = await res.json()
        if(data.code === 200){
            let text = data.data.replace(/\n/g,"<br>")
            box.innerHTML = `<div class="text-gray-700 text-sm leading-relaxed">${text}</div>`
        }else{
            box.innerHTML = `<p class="text-red-500 text-center">接口临时繁忙，请稍后再试</p >`
        }
    }catch(e){
        box.innerHTML = `<p class="text-red-500 text-center">网络请求失败，请稍后再试</p >`
    }
}
</script>
</body>
</html>
