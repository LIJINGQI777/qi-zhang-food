// 本地兜底规则（AI 挂了也不会空白）
function localRuleSuggestion(food){
    let lower=food.toLowerCase();
    if(/冰|冷|冻|冰镇|冰淇淋|雪糕/.test(lower)) return "❌ 生冷寒凉，易刺激肠胃、加重胀气，胀气期尽量避免。";
    if(/辣|麻辣|香辣|剁椒|泡椒|火鸡/.test(lower)) return "❌ 辛辣刺激，易损伤胃黏膜、引发胀气与不适，肠胃弱少吃。";
    if(/炸|煎|油焖|干锅|烧烤/.test(lower)) return "❌ 高油高脂，难消化、易产气，胀气期尽量忌口。";
    if(/粥|蒸|煮|清汤|白灼/.test(lower)) return "✅ 清淡易消化，温和养胃，不易胀气，三餐都适合。";
    return "⚠️ 非重口/生冷/油炸类，建议午餐少量吃，做法清淡、少油少辣，保护肠胃。";
}

async function checkFood(){
    let food=document.getElementById("foodName").value.trim();
    if(!food){alert("请输入食物名称");return;}
    let box=document.getElementById("resultBox");
    box.classList.remove("hidden");

    // 1. 本地库优先
    let isGreen=foodData.good.some(item=>food.includes(item));
    let isYellow=foodData.normal.some(item=>food.includes(item));
    let isRed=foodData.avoid.some(item=>food.includes(item));

    if(isGreen){
        box.innerHTML=`
        <h3 class="text-safe font-bold text-lg"><i class="fa-solid fa-check mr-2"></i>✅ 养胃优选 全天可吃</h3>
        <p class="text-gray-600 mt-2 text-sm">食材性质温和，清淡易消化，不易产生胀气，早中晚三餐都可以放心食用。</p >
        `;
        return;
    }
    if(isYellow){
        box.innerHTML=`
        <h3 class="text-warn font-bold text-lg"><i class="fa-solid fa-circle-exclamation mr-2"></i>⚠️ 适量食用 建议午餐食用</h3>
        <p class="text-gray-600 mt-2 text-sm">肠胃偏弱人群尽量少吃，最佳食用时间为中午，吃完多喝温水、散步促进消化。</p >
        `;
        return;
    }
    if(isRed){
        box.innerHTML=`
        <h3 class="text-bad font-bold text-lg"><i class="fa-solid fa-xmark mr-2"></i>❌ 极易胀气 胀气期尽量忌口</h3>
        <p class="text-gray-600 mt-2 text-sm">重油重辣易产气，容易引发腹胀腹痛，肠胃不适期间严格少吃，误食可参照上方方法快速缓解。</p >
        `;
        return;
    }

    // 2. AI 三重兜底：主接口→备用→本地规则
    box.innerHTML=`<p class="loading text-center text-gray-500">🤖 AI智能深度分析食材属性中...</p >`;
    let aiResult=await getAIFoodInfo(food);
    if(!aiResult) aiResult=await getBackupAIFoodInfo(food);
    if(!aiResult) aiResult=localRuleSuggestion(food);

    box.innerHTML=`
    <h3 class="text-mainGreen font-bold text-lg mb-2"><i class="fa-solid fa-robot mr-2"></i>AI智能饮食分析</h3>
    <p class="text-gray-600 text-sm whitespace-pre-line">${aiResult}</p >
    `;
}

// 主AI接口（DeepSeek 国内稳）
async function getAIFoodInfo(name){
    const prompt=`你是专业养胃饮食健康顾问，精准分析【${name}】这款食物，精简回答：
1.是否容易胀气
2.消化难易程度
3.最佳食用时间段
4.肠胃虚弱人群食用建议
5.误食胀气舒缓办法
语言通俗简短，贴合大学生日常饮食`;
    try{
        let controller=new AbortController();
        setTimeout(()=>controller.abort(),5000); // 5秒超时
        const res=await fetch("https://api.deepseek.com/v1/chat/completions",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" // 你自己去 DeepSeek 注册填 key
            },
            body:JSON.stringify({
                model:"deepseek-chat",
                messages:[{"role":"user","content":prompt}],
                temperature:0.3
            }),
            signal:controller.signal
        });
        if(!res.ok) throw new Error("fail");
        let data=await res.json();
        return data.choices[0].message.content;
    }catch(e){
        return null;
    }
}

// 备用AI接口（聚合平台，兜底）
async function getBackupAIFoodInfo(name){
    const prompt=`简要分析食物【${name}】是否胀气、消化难度、最佳食用时间、养胃建议`;
    try{
        let controller=new AbortController();
        setTimeout(()=>controller.abort(),5000);
        const res=await fetch("https://api.siliconflow.cn/v1/chat/completions",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" // 备用 key
            },
            body:JSON.stringify({
                model:"Qwen/Qwen3-8B",
                messages:[{"role":"user","content":prompt}],
                temperature:0.3
            }),
            signal:controller.signal
        });
        if(!res.ok) throw new Error("fail");
        let data=await res.json();
        return data.choices[0].message.content;
    }catch(e){
        return null;
    }
}
