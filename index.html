// 主查询函数
function checkFood(){
    let food = document.getElementById("foodName").value.trim();
    if(!food){alert("请输入食物名称");return;}
    let box = document.getElementById("resultBox");
    box.classList.remove("hidden");

    // 优先匹配本地海量数据库
    let isGreen = foodData.good.some(item=>food.includes(item));
    let isYellow = foodData.normal.some(item=>food.includes(item));
    let isRed = foodData.avoid.some(item=>food.includes(item));

    if(isGreen){
        box.innerHTML = `
        <h3 class="text-safe font-bold text-lg"><i class="fa-solid fa-check mr-2"></i>✅ 养胃优选 全天可吃</h3>
        <p class="text-gray-600 mt-2 text-sm">食材性质温和，清淡易消化，不易产生胀气，早中晚三餐都可以放心食用。</p >
        `;
        return;
    }
    if(isYellow){
        box.innerHTML = `
        <h3 class="text-warn font-bold text-lg"><i class="fa-solid fa-circle-exclamation mr-2"></i>⚠️ 适量食用 建议午餐食用</h3>
        <p class="text-gray-600 mt-2 text-sm">肠胃偏弱人群尽量少吃，最佳食用时间为中午，吃完多喝温水、散步促进消化。</p >
        `;
        return;
    }
    if(isRed){
        box.innerHTML = `
        <h3 class="text-bad font-bold text-lg"><i class="fa-solid fa-xmark mr-2"></i>❌ 极易胀气 胀气期尽量忌口</h3>
        <p class="text-gray-600 mt-2 text-sm">重油重辣易产气，容易引发腹胀腹痛，肠胃不适期间严格少吃，误食可参照上方方法快速缓解。</p >
        `;
        return;
    }

    // 本地无匹配 直接调用稳定AI兜底
    box.innerHTML = `<p class="loading text-center text-gray-500">🤖 AI智能深度分析食材属性中...</p >`;
    getAIFoodInfo(food,box);
}

// 稳定AI食材解析接口
async function getAIFoodInfo(name,dom){
    const prompt = `你是专业养胃饮食健康顾问，精准分析【${name}】这款食物，严格精简回答：
1. 判断是否容易造成肠胃胀气
2. 肠胃消化难易程度
3. 最佳食用时间段
4. 肠胃虚弱人群食用建议
5. 不慎食用后的舒缓小办法
语言简洁通俗，贴合大学生日常饮食，不要多余废话`;

    try{
        const res = await fetch(`https://api.yeai.com/v1/chat/completions`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                model:"gpt-3.5-turbo",
                messages:[{"role":"user","content":prompt}],
                temperature:0.3
            })
        });
        const data = await res.json();
        let aiText = data.choices[0].message.content;
        dom.innerHTML = `
        <h3 class="text-mainGreen font-bold text-lg mb-2"><i class="fa-solid fa-robot mr-2"></i>AI智能饮食分析</h3>
        <p class="text-gray-600 text-sm whitespace-pre-line">${aiText}</p >
        `;
    }catch(e){
        dom.innerHTML = `
        <h3 class="text-warn font-bold text-lg"><i class="fa-solid fa-info-circle mr-2"></i>饮食通用建议</h3>
        <p class="text-gray-600 mt-2 text-sm">陌生食材初次少量尝试，优先安排在午餐食用，清淡做法最佳，少吃生冷辛辣，保护肠胃减少胀气。</p >
        `;
    }
}
