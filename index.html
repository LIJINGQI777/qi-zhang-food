                <li>✅ 饮用温热水、陈皮水、大麦茶促进肠胃蠕动</li>
                <li>✅ 平躺屈膝放松腹部，简单拉伸舒缓腹胀</li>
                <li>✅ 胀气期间避开生冷、豆类、辛辣、重油食物</li>
            </ul>
        </div>

        <p class="text-center text-gray-500 text-xs mt-8">🌿 清淡饮食 · 少食多餐 · 温和养脾胃</p >
    </div>

function checkFood(){
    let food = document.getElementById("foodName").value.trim()
    if(!food){alert("请输入食物名称");return}
    let box = document.getElementById("resultBox")
    box.classList.remove("hidden")

    let isGood = foodData.good.some(v=>food.includes(v))
    let isNormal = foodData.normal.some(v=>food.includes(v))
    let isAvoid = foodData.avoid.some(v=>food.includes(v))

    if(isGood){
        box.innerHTML = `
        <h3 class="text-safe font-bold text-lg"><i class="fa-solid fa-check mr-2"></i>✅ 养胃优选 全天可吃</h3>
        <p class="text-gray-600 mt-2 text-sm">性质温和极易消化，几乎不产生胀气，早中晚三餐都适合食用。</p >
        `
    }else if(isNormal){
        box.innerHTML = `
        <h3 class="text-warn font-bold text-lg"><i class="fa-solid fa-circle-exclamation mr-2"></i>⚠️ 适量食用 建议午餐吃</h3>
        <p class="text-gray-600 mt-2 text-sm">肠胃偏弱尽量少吃，仅放在中午食用最佳，吃完多喝温水散步帮助消化。</p >
        `
    }else if(isAvoid){
        box.innerHTML = `
        <h3 class="text-bad font-bold text-lg"><i class="fa-solid fa-xmark mr-2"></i>❌ 容易胀气 尽量忌口</h3>
        <p class="text-gray-600 mt-2 text-sm">重油重辣易产气，胀气期间严格少吃，不慎食用可参考下方方法快速缓解不适。</p >
        `
    }else{
        box.innerHTML = `
        <h3 class="text-gray-700 font-bold text-lg"><i class="fa-solid fa-leaf mr-2"></i>暂无收录食材</h3>
        <p class="text-gray-600 mt-2 text-sm">初次食用建议少量尝试，优先安排在午餐，食用后观察自身肠胃状态即可。</p >
        `
    }
}
</script>
