<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>养胃饮食小助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config={theme:{extend:{colors:{mainGreen:'#2E9E72',safe:'#2E9E72',warn:'#E6A23C',bad:'#E53E3E'}}}}
    </script>
    <style>
        body{
            background:#f5fbf8 url(https://img0.baidu.com/it/u=1817352239,2110202039&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500) center/cover no-repeat fixed;
            background-blend-mode:overlay;
            background-color:#f5fbf8;
        }
        .soft-card{
            background:rgba(255,255,255,0.88);
            backdrop-filter:blur(6px);
        }
        .loading{animation:fade 1.2s infinite;}
        @keyframes fade{0%,100%{opacity:0.4;}50%{opacity:1;}}
    </style>
</head>
<body class="p-5 min-h-screen">
    <div class="max-w-md mx-auto">
        <div class="text-center mt-4 mb-8">
            <i class="fa-solid fa-seedling text-mainGreen text-3xl"></i>
            <h2 class="text-2xl font-bold text-gray-700 mt-2">养胃饮食小助手</h2>
            <p class="text-gray-500 text-sm mt-1">本地极速查询+AI全能智能判断</p>
        </div>
        <div class="soft-card rounded-2xl p-5 shadow-md">
            <input id="foodName" class="w-full p-3 rounded-xl border border-green-100 outline-none text-base" placeholder="三餐饭菜/超市食材/零食饮品全都能查">
            <button onclick="checkFood()" class="w-full mt-4 bg-mainGreen text-white py-3 rounded-xl font-medium">立即查询</button>
        </div>
        <div id="resultBox" class="soft-card rounded-2xl p-5 mt-5 hidden"></div>
        <div class="soft-card rounded-2xl p-5 mt-6 shadow-md">
            <h3 class="font-bold text-gray-700 text-lg mb-3"><i class="fa-solid fa-hand-holding-heart text-mainGreen mr-2"></i>胀气快速缓解方法</h3>
            <ul class="text-sm text-gray-600 space-y-2">
                <li>✅ 饭后慢走15分钟，顺时针轻柔按摩腹部排气</li>
                <li>✅ 饮用温热水、陈皮水、大麦茶促进肠胃蠕动</li>
                <li>✅ 平躺屈膝放松腹部，简单拉伸舒缓腹胀</li>
                <li>✅ 胀气期间避开生冷、豆类、辛辣、重油重盐食物</li>
            </ul>
        </div>
        <p class="text-center text-gray-500 text-xs mt-8">🌿 清淡饮食 少食多餐 温和养脾胃</p>
    </div>
<script>
const foodData={
good:["白米饭","软米饭","小米粥","大米粥","清汤面","白馒头","蒸山药","生菜","冬瓜","水煮蛋","鸡胸肉","纯牛奶","苹果","番茄鸡蛋汤","清炒时蔬"],
normal:["番茄炒蛋","西红柿炒鸡蛋","家常豆腐","土豆丝","清蒸鱼","清炖鸡汤","普通面包","常温酸奶","香蕉"],
avoid:["烤肉","炸鸡","烧烤","火锅","螺蛳粉","酸辣粉","辣条","冰镇饮料","韭菜","洋葱","重油重辣菜品"]
};

function localRuleTip(foodName){
    let txt = foodName.toLowerCase();
    if(/冰|冻|冷饮/.test(txt)) return '❌ 生冷食物，极易引发肠胃胀气，肠胃弱尽量不吃';
    if(/辣|麻辣|香辣/.test(txt)) return '❌ 辛辣刺激食物，容易刺激胃黏膜，诱发胀气不适';
    if(/炸|烤|煎|烧烤|烤肉/.test(txt)) return '❌ 高油高脂难消化，进食后很容易腹胀胀气';
    if(/粥|蒸|清汤|水煮/.test(txt)) return '✅ 清淡易消化，温和养胃，几乎不会产生胀气';
    return '';
}

async function checkFood(){
    let food = document.getElementById("foodName").value.trim();
    if(!food){alert("请输入食物名称");return;}
    let box = document.getElementById("resultBox");
    box.classList.remove("hidden");

    let ok = foodData.good.some(v=>food.includes(v));
    let mid = foodData.normal.some(v=>food.includes(v));
    let no = foodData.avoid.some(v=>food.includes(v));

    if(ok){
        box.innerHTML=`<h3 class="text-safe font-bold text-lg"><i class="fa-solid fa-check mr-2"></i>✅ 养胃优选 不易胀气</h3><p class="text-gray-600 mt-2 text-sm">清淡好消化，温和护肠胃，全天放心吃。</p>`;
        return;
    }
    if(mid){
        box.innerHTML=`<h3 class="text-warn font-bold text-lg"><i class="fa-solid fa-circle-exclamation mr-2"></i>⚠️ 少量食用 轻微产气</h3><p class="text-gray-600 mt-2 text-sm">适量吃没问题，尽量放在中午食用最佳。</p>`;
        return;
    }
    if(no){
        box.innerHTML=`<h3 class="text-bad font-bold text-lg"><i class="fa-solid fa-xmark mr-2"></i>❌ 容易胀气 肠胃弱少吃</h3><p class="text-gray-600 mt-2 text-sm">油脂/刺激性强，很容易腹胀，胀气期尽量忌口。</p>`;
        return;
    }

    box.innerHTML=`<p class="loading text-center text-gray-500">🤖 DeepSeek AI 精准判断胀气属性...</p>`;
    let res = await getAI(food);
    if(!res) res = localRuleTip(food);
    box.innerHTML=`<h3 class="text-mainGreen font-bold text-lg mb-2"><i class="fa-solid fa-robot mr-2"></i>AI胀气判定结果</h3><p class="text-gray-600 text-sm">${res}</p>`;
}

async function getAI(name){
    let prompt=`直接精准回答：${name}是不是容易胀气的食物？肠胃虚弱能不能吃？简短直白说明即可`;
    try{
        let ctrl=new AbortController();
        setTimeout(()=>ctrl.abort(),5000);
        let res=await fetch("https://api.deepseek.com/v1/chat/completions",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer sk-03f94a5227184c30a9baf7bcea7e34cb"
            },
            body:JSON.stringify({model:"deepseek-chat",messages:[{"role":"user","content":prompt}],temperature:0.1}),
            signal:ctrl.signal
        });
        let d=await res.json();
        return d.choices[0].message.content;
    }catch(e){return null;}
}
</script>
</body>
</html>
