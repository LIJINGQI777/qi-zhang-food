function localRuleTip(foodName){
    let txt = foodName.toLowerCase();
    if(/冰|凉|冻|雪糕|冷饮/.test(txt)) return '❌ 生冷食物，刺激肠胃容易胀气，肠胃虚弱尽量少吃';
    if(/辣|麻辣|香辣|剁椒/.test(txt)) return '❌ 辛辣刺激，伤胃易胀气，恢复期忌口';
    if(/炸|煎|烧烤|油焖/.test(txt)) return '❌ 高油难消化，极易腹胀，不建议多吃';
    if(/粥|蒸|清汤|白灼|水煮/.test(txt)) return '✅ 清淡好消化，温和养胃，全天都能吃';
    return '⚠️ 普通日常食材，建议中午适量食用，做法清淡少油更护肠胃';
}

async function checkFood(){
    let food = document.getElementById("foodName").value.trim();
    if(!food){alert("请输入食物名称");return;}
    let box = document.getElementById("resultBox");
    box.classList.remove("hidden");

    let ok = foodData.good.some(v=>food.includes(v));
    let mid = foodData.normal.some(v=>food.includes(v));
    let no = foodData.avoid.some(v=>food.includes(v));

    if(ok){
        box.innerHTML=`<h3 class="text-safe font-bold text-lg"><i class="fa-solid fa-check mr-2"></i>✅ 养胃优选 全天可吃</h3><p class="text-gray-600 mt-2 text-sm">温和清淡好消化，几乎不胀气，三餐放心吃。</p>`;
        return;
    }
    if(mid){
        box.innerHTML=`<h3 class="text-warn font-bold text-lg"><i class="fa-solid fa-circle-exclamation mr-2"></i>⚠️ 适量食用 建议午餐吃</h3><p class="text-gray-600 mt-2 text-sm">消化中等，肠胃弱少吃，中午吃最合适。</p>`;
        return;
    }
    if(no){
        box.innerHTML=`<h3 class="text-bad font-bold text-lg"><i class="fa-solid fa-xmark mr-2"></i>❌ 易胀气 尽量忌口</h3><p class="text-gray-600 mt-2 text-sm">重油重辣易产气，胀气期间少吃，不舒服及时舒缓。</p>`;
        return;
    }

    box.innerHTML=`<p class="loading text-center text-gray-500">🤖 AI智能分析中...</p>`;
    let res = await getMainAI(food);
    if(!res) res = localRuleTip(food);

    box.innerHTML=`<h3 class="text-mainGreen font-bold text-lg mb-2"><i class="fa-solid fa-robot mr-2"></i>AI饮食分析</h3><p class="text-gray-600 text-sm">${res}</p>`;
}

async function getMainAI(name){
    let prompt=`分析${name}是否容易胀气、消化难度、最佳食用时间、养胃食用建议，简短清晰`;
    try{
        let ctrl = new AbortController();
        setTimeout(()=>ctrl.abort(),5000);
        let res=await fetch("https://api.deepseek.com/v1/chat/completions",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer sk-03f94a5227184c30a9baf7bcea7e34cb"
            },
            body:JSON.stringify({model:"deepseek-chat",messages:[{"role":"user","content":prompt}],temperature:0.2}),
            signal:ctrl.signal
        });
        let d=await res.json();
        return d.choices[0].message.content;
    }catch(e){return null;}
}
