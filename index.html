<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>养胃饮食小助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mainGreen: '#2E9E72',
                        safe: '#2E9E72',
                        warn: '#E6A23C',
                        bad: '#E53E3E',
                    }
                }
            }
        }
    </script>
    <style>
        body{
            background: #f5fbf8 url(https://img0.baidu.com/it/u=1817352239,2110202039&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500) center/cover no-repeat fixed;
            background-blend-mode: overlay;
            background-color: #f5fbf8;
        }
        .soft-card{
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(6px);
        }
        .loading{
            animation: fade 1.2s infinite;
        }
        @keyframes fade{
            0%,100%{opacity:0.4;}
            50%{opacity:1;}
        }
    </style>
</head>
<body class="p-5 min-h-screen">
    <div class="max-w-md mx-auto">
        <!-- 顶部标题 -->
        <div class="text-center mt-4 mb-8">
            <i class="fa-solid fa-seedling text-mainGreen text-3xl"></i>
            <h2 class="text-2xl font-bold text-gray-700 mt-2">养胃饮食小助手</h2>
            <p class="text-gray-500 text-sm mt-1">呵护肠胃不胀气 · 常吃食物直接查</p >
        </div>

        <!-- 搜索区域 -->
        <div class="soft-card rounded-2xl p-5 shadow-md">
            <input id="foodName" class="w-full p-3 rounded-xl border border-green-100 outline-none text-base" placeholder="输入任意食物/外卖菜品">
            <button onclick="checkFood()" class="w-full mt-4 bg-mainGreen text-white py-3 rounded-xl font-medium">
                查询
            </button>
        </div>

        <!-- 查询结果 -->
        <div id="resultBox" class="soft-card rounded-2xl p-5 mt-5 hidden"></div>

        <!-- 底部文案 -->
        <p class="text-center text-gray-500 text-xs mt-8">🌿 清淡饮食 · 少食多餐 · 养好脾胃</p >
    </div>

<script>
// 本地数据库（收录你常吃的所有食物）
const foodData = {
    good: [
        "小米粥","白粥","清汤面","挂面","馒头","蒸山药","蒸南瓜","鸡蛋","水煮蛋",
        "鸡胸肉","鲈鱼","冬瓜","生菜","油麦菜","娃娃菜","胡萝卜","银耳","藕粉"
    ],
    normal: [
        "猪肘饭","茄子包","青椒鸡腿包","玉米","燕麦","苹果","桃子","葡萄","香菇"
    ],
    avoid: [
        "板面","朱家小馆酸菜肉燥面","韭菜","洋葱","西兰花","卷心菜","豆角",
        "豆腐","豆浆","奶茶","油炸食品","烧烤","辣椒","碳酸饮料"
    ]
};

function checkFood(){
    let food = document.getElementById("foodName").value.trim()
    if(!food){alert("请输入食物名称");return}
    let box = document.getElementById("resultBox")
    box.classList.remove("hidden")

    // 先查本地数据库
    let isGood = foodData.good.some(v=>food.includes(v))
    let isNormal = foodData.normal.some(v=>food.includes(v))
    let isAvoid = foodData.avoid.some(v=>food.includes(v))

    if(isGood){
        box.innerHTML = `
        <h3 class="text-safe font-bold text-lg"><i class="fa-solid fa-check mr-2"></i>适合常吃 · 养胃佳品</h3>
        <p class="text-gray-600 mt-2 text-sm">清淡易消化，早晚都能吃，对肠胃十分友好。</p >
        `
    }else if(isNormal){
        box.innerHTML = `
        <h3 class="text-warn font-bold text-lg"><i class="fa-solid fa-circle-exclamation mr-2"></i>适量食用 · 不宜多吃</h3>
        <p class="text-gray-600 mt-2 text-sm">建议仅午餐少量食用，吃多容易腹胀不适。</p >
        `
    }else if(isAvoid){
        box.innerHTML = `
        <h3 class="text-bad font-bold text-lg"><i class="fa-solid fa-xmark mr-2"></i>尽量少吃 · 容易胀气</h3>
        <p class="text-gray-600 mt-2 text-sm">产气油腻较重，肠胃虚弱期间建议忌口。</p >
        `
    }else{
        // 本地没收录，给通用建议
        box.innerHTML = `
        <h3 class="text-gray-500 font-bold text-lg">暂无收录食材</h3>
        <p class="text-gray-600 mt-2 text-sm">建议少量尝试，优先放在午餐食用，观察肠胃反应~</p >
        `
    }
}
</script>
</body>
</html>
